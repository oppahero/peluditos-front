<app-basic-table
  [rows]="rows()"
  [cols]="cols"
  title="Persona Natural"
  [selection]="selected"
  [pageInfo]="pageInfo()"
  [globalFilterFields]="[
    'person.taxpayer_type',
    'dni',
    'person.name',
    'person.phone',
    'person.email',
  ]"
  (nextPage)="nextPage()"
  (resetPage)="prevPage()"
  (prevPage)="resetPage()"
>
  >
  <ng-template #body let-rowData let-columns="columns">
    <td class="whitespace-nowrap">{{ rowData.person.taxpayer_type }}-{{ rowData.dni }}</td>
    <td class="whitespace-nowrap">{{ rowData.person.name }}</td>
    <td class="whitespace-nowrap">{{ rowData.person.phone | phone }}</td>
    <td class="whitespace-nowrap">{{ rowData.person.email }}</td>
  </ng-template>
</app-basic-table>
