<p-dialog
  [header]="title()"
  [modal]="modal"
  [(visible)]="visible"
  [style]="style"
  [position]="position()"
>
  <ng-content></ng-content>

  <div class="flex justify-end gap-2">
    <p-button label="Cancel" severity="secondary" (click)="cancel()" />
    <p-button label="Save" (click)="save()" />
  </div>
</p-dialog>
