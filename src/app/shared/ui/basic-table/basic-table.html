<p-table
  #dt
  size="small"
  [columns]="cols()"
  [value]="rows() ?? []"
  [paginator]="paginator()"
  [rows]="numOfRows()"
  [selectionMode]="selectionMode()"
  [(selection)]="selection"
  [scrollable]="scrollable()"
  [scrollHeight]="scrollHeight()"
  filterMode="global"
  [globalFilterFields]="globalFilterFields()"
  currentPageReportTemplate="Mostrando {first} al {last} de {totalRecords} registros"
>
  <ng-template #caption>
    <div class="flex items-center justify-between">
      <h5 class="m-0">{{ title() }}</h5>
      <p-iconfield>
        <p-inputicon class="pi pi-search" />
        <input
          #searchInput
          pInputText
          type="text"
          (input)="dt.filterGlobal(searchInput.value, 'contains')"
          placeholder="Search..."
          pSize="small"
        />
      </p-iconfield>
    </div>
  </ng-template>
  <ng-template #header let-columns>
    <tr>
      @for (col of columns; track col) {
        <th>
          {{ col.header }}
        </th>
      }
    </tr>
  </ng-template>
  <ng-template #body let-rowData let-columns="columns">
    @if (customBodyTemplate) {
      <tr [pSelectableRow]="rowData">
        <ng-container
          [ngTemplateOutlet]="customBodyTemplate"
          [ngTemplateOutletContext]="{ $implicit: rowData, columns: cols }"
        >
        </ng-container>
      </tr>
    } @else {
      <tr [pSelectableRow]="rowData">
        @for (col of columns; track col) {
          <td>
            {{ rowData[col.field] }}
          </td>
        }
      </tr>
    }
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td [attr.colspan]="cols()?.length">No se han encontrado registros.</td>
    </tr>
  </ng-template>
  <ng-template #summary>
    <div class="flex justify-center pt-2.5">
      <p-button
        type="button"
        icon="pi pi-chevron-left"
        (click)="prev()"
        [disabled]="isFirstPage()"
        text
      />
      <input type="text" class="w-10 text-center" readonly pInputText [value]="pageInfo()?.page" />
      <p-button type="button" icon="pi pi-refresh" (click)="reset()" text />
      <p-button
        type="button"
        icon="pi pi-chevron-right"
        (click)="next()"
        [disabled]="isLastPage()"
        text
      />
    </div>
  </ng-template>
  @if (pageInfo()) {
    <ng-template #footer>
      <tr>
        <td colspan="6">Total de registros: {{ pageInfo().total ?? 0 }} registros.</td>
      </tr>
    </ng-template>
  }
</p-table>
