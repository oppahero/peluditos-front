<p-table
  #dt
  [columns]="cols()"
  [value]="rows() ?? []"
  [paginator]="paginator()"
  size="small"
  filterMode="global"
  [globalFilterFields]="globalFilterFields()"
>
  <ng-template #caption>
    <div class="flex items-center justify-between">
      <h5 class="m-0">{{ title() }}</h5>
      <p-iconfield>
        <p-inputicon class="pi pi-search" />
        <input
          #searchInput
          pInputText
          type="text"
          (input)="dt.filterGlobal(searchInput.value, 'contains')"
          placeholder="Search..."
          pSize="small"
        />
      </p-iconfield>
    </div>
  </ng-template>
  <ng-template #header let-columns>
    <tr>
      @for (col of columns; track col) {
      <th>
        {{ col.header }}
      </th>
      }
    </tr>
  </ng-template>
  <ng-template #body let-rowData let-columns="columns">
    @if (customBodyTemplate) {
    <ng-container
      [ngTemplateOutlet]="customBodyTemplate"
      [ngTemplateOutletContext]="{ $implicit: rowData, columns: cols }"
    >
    </ng-container>
    } @else {
    <tr>
      @for (col of columns; track col) {
      <td>
        {{ rowData[col.field] }}
      </td>
      }
    </tr>
    }
  </ng-template>
</p-table>
